name: iOS Build

# ─────────────────────────────────────────────────────────────────────────────
# CURRENT MODE: Simulator build (no Apple Developer account required)
#
# TO ACTIVATE REAL DEVICE DISTRIBUTION (when Apple account is paid):
#   1. Uncomment the "Beta Distribution" job below
#   2. Comment out or delete the "Simulator Build" job
#   3. Add the required secrets to this repo's Settings → Secrets → Actions
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

jobs:

  # ── ACTIVE: Simulator build — works with no Apple account ──────────────────
  simulator-build:
    name: Simulator Build
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Setup Ruby + Bundler cache
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Fastlane plugins
        run: bundle install

      - name: Build for simulator via Fastlane
        run: bundle exec fastlane build_sim

      - name: Find built .app
        id: find_app
        run: |
          APP_PATH=$(find ./build/DerivedData -name "raCommand.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT
          echo "Found app at: $APP_PATH"

      - name: Upload simulator .app as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raCommand-simulator-${{ github.run_number }}
          path: ${{ steps.find_app.outputs.app_path }}
          retention-days: 14
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "### ✅ raCommand Simulator Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 Download the \`.app\` artifact above and drag it into the iOS Simulator to preview." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "⏳ *Real device distribution activates once Apple Developer account is paid.*" >> $GITHUB_STEP_SUMMARY


